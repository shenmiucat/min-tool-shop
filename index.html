<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Min 的工具雜貨舖</title>
    <meta
      name="description"
      content="簡約護眼的個人日常小工具網頁應用，整合靈感待辦抽籤器、BOM 料號格式檢查器與常用工具入口，支援本機儲存與 JSON 備份還原。"
    />
    <meta property="og:title" content="Min 的工具雜貨舖" />
    <meta
      property="og:description"
      content="簡約護眼的個人日常小工具網頁應用，整合靈感待辦抽籤器、BOM 料號格式檢查器與常用工具入口。"
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // 防止頁面載入時深淺色模式閃爍
      (function () {
        try {
          var saved = localStorage.getItem('min_workshop_theme_v1');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F7F6F2] text-[#232A27] antialiased selection:bg-[#4A6B5D]/20 selection:text-[#232A27] dark:bg-[#161A18] dark:text-[#EAECE9] dark:selection:bg-[#7CA392]/25 dark:selection:text-[#EAECE9]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
